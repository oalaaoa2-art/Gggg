  // Математические middle тоже присутствуют, но для экономии просто добавим пару (в репе уже есть все)
  // Дополним math mid (несколько из файла, для полноты)
  const EXTRA_MATH_MID = [
    {"level": "middle", "type": "math", "text": "Вы взяли кредит 2000 рублей на год под 15% годовых. Какова общая сумма переплаты?", "options": ["150", "200", "300", "400"], "answer": "300", "explanation": "15% от 2000 = 300"},
    {"level": "middle", "type": "math", "text": "Вы оформили рассрочку на товар за 600 рублей на 3 месяца. Переплата 10% от цены. Сколько вы заплатите за всё время?", "options": ["630", "660", "600", "720"], "answer": "660", "explanation": "10% от 600 = 60, итого 660"}
  ];
  const QUESTIONS = [...QUESTIONS_RAW, ...EXTRA_MATH_MID];

  // ---------- Глобальные хранилища ----------
  let currentUserId = localStorage.getItem('fin_user_id');
  if (!currentUserId) { currentUserId = 'user_' + Date.now() + '_' + Math.random().toString(36); localStorage.setItem('fin_user_id', currentUserId); }

  let appState = { mode: null, session: null }; // режим: 'test', 'random', 'infinite'
  let currentView = 'menu';

  // вспомогательные функции сохранения достижений, статистики
  function loadStore() { return JSON.parse(localStorage.getItem(`fin_${currentUserId}`) || '{"stats":{"tests":0,"bestScore":0,"bestTotal":0,"totalCorrect":0,"totalQuestions":0,"weeklyCups":0,"maxStreak":0},"achievements":[],"levelsCompleted":{},"correctAnswers":[]}'); }
  function saveStore(data) { localStorage.setItem(`fin_${currentUserId}`, JSON.stringify(data)); }

  function updateWeeklyCups(earned) { let store = loadStore(); store.stats.weeklyCups = (store.stats.weeklyCups || 0) + earned; saveStore(store); }
  function updateTestStat(correct, total, diff) {
    let store = loadStore();
    store.stats.tests = (store.stats.tests || 0) + 1;
    store.stats.totalCorrect = (store.stats.totalCorrect || 0) + correct;
    store.stats.totalQuestions = (store.stats.totalQuestions || 0) + total;
    if (correct > (store.stats.bestScore || 0)) { store.stats.bestScore = correct; store.stats.bestTotal = total; }
    if (correct === total && total >= 10 && !store.achievements.includes('🎯 10/10 🎯')) store.achievements.push('🎯 10/10 🎯');
    if (correct === total) { store.levelsCompleted[diff] = true; if (store.levelsCompleted.easy && store.levelsCompleted.middle && store.levelsCompleted.hard && !store.achievements.includes('🧠 Знаток 🧠')) store.achievements.push('🧠 Знаток 🧠'); }
    saveStore(store);
  }

  function addAchievement(name) { let store = loadStore(); if (!store.achievements.includes(name)) store.achievements.push(name); saveStore(store); }
  function checkQuizExpert() { let store = loadStore(); let allQuizIndices = QUESTIONS.filter((_,idx)=> QUESTIONS[idx].type === 'quiz').map((_,i)=>i); let answeredCorrect = store.correctAnswers || []; let allAnswered = allQuizIndices.every(idx => answeredCorrect.includes(idx)); if(allAnswered && !store.achievements.includes('💎 Эксперт 💎')) { store.achievements.push('💎 Эксперт 💎'); saveStore(store); } }

  // генерация динамических задач (сжатая адаптация)
  function generateDynamicQuestion(diff, streak=0) { /* ... полная логика из python адаптирована кратко */
    // Сокращённый, но работающий генератор (ключевые типы)
    const itemsDB = {"книга":[10,30],"настольная игра":[5,40],"смартфон":[400,4000],"билет в кино":[15,25],"чайник":[80,150],"обед в кафе":[30,70],"зимняя куртка":[150,300],"горный велосипед":[500,1200],"робот-пылесос":[800,3600],"монитор":[270,890]};
    const itemNames = Object.keys(itemsDB);
    let mult = 1 + (Math.floor(streak/5) * 0.7);
    let rand = (a,b)=> Math.floor(Math.random()*(b-a+1)+a);
    let priceItem = (name)=> Math.floor(rand(itemsDB[name][0], itemsDB[name][1]) * mult);
    let item = itemNames[Math.floor(Math.random()*itemNames.length)];
    let types = ["discount_find_final","simple_interest","cashback","currency_exchange","inflation","loan_interest"];
    let type = types[Math.floor(Math.random()*types.length)];
    if(type === "discount_find_final"){ let orig = priceItem(item); let p = rand(5,30); let disc = Math.floor(orig*p/100); let final = orig-disc; return {text:`Товар стоил ${orig} руб., скидка ${p}%. Сколько рублей заплатить?`, answer:final, options:[final-10,final,final+5,final+15].map(String), explanation:`Скидка ${p}%`, type:"math"}; }
    if(type === "simple_interest"){ let dep = rand(800,5000); let rate = rand(8,15); let years = rand(1,5); let interest = dep*rate/100*years; return {text:`Вклад ${dep} руб. под ${rate}% на ${years} лет, простые проценты. Сумма процентов?`, answer:Math.floor(interest), options:[Math.floor(interest*0.8),Math.floor(interest),Math.floor(interest*1.1),Math.floor(interest*1.2)].map(String), explanation:`Годовой процент = ${dep*rate/100}`}; }
    if(type === "cashback"){ let price = priceItem(item); let cb = [2,3,5,7,10][Math.floor(Math.random()*5)]; let cash = Math.floor(price*cb/100); return {text:`Кэшбэк ${cb}%, купили ${item} за ${price} руб. Сколько вернётся?`, answer:cash, options:[cash-5,cash,cash+5,cash+10].map(String), explanation:`${price}*${cb}/100`}; }
    if(type === "currency_exchange"){ let rate = (Math.random()*0.8+3).toFixed(2); let amt = rand(50,500); let total = Math.floor(amt*rate); return {text:`Курс ${rate} руб/доллар. Нужно ${amt} долларов. Сколько рублей?`, answer:total, options:[total-20,total,total+15,total+30].map(String)}; }
    if(type === "inflation"){ let price = priceItem(item); let inf = rand(4,12); let newPrice = Math.floor(price*(1+inf/100)); return {text:`Инфляция ${inf}%, товар сейчас ${price} руб. Цена через год?`, answer:newPrice, options:[newPrice-15,newPrice,newPrice+10,newPrice+20].map(String)}; }
    let loan = rand(2500,6000); let rater = rand(12,18); let interestY = Math.floor(loan*rater/100); return {text:`Кредит ${loan} руб. под ${rater}% годовых, проценты за год?`, answer:interestY, options:[interestY-50,interestY,interestY+40,interestY+70].map(String)};
  }

  // Рендер главного меню
  function renderMenu() {
    const menuHtml = `<div class="menu-grid">
      <button class="menu-btn" data-action="test"><i class="fas fa-play"></i> Тест</button>
      <button class="menu-btn" data-action="random"><i class="fas fa-dice"></i> Случайная задача</button>
      <button class="menu-btn" data-action="infinite"><i class="fas fa-infinity"></i> Бесконечная</button>
      <button class="menu-btn" data-action="leaderboard"><i class="fas fa-trophy"></i> Таблица лидеров</button>
      <button class="menu-btn" data-action="achievements"><i class="fas fa-medal"></i> Достижения</button>
      <button class="menu-btn" data-action="profile"><i class="fas fa-user"></i> Профиль</button>
      <button class="menu-btn" data-action="about"><i class="fas fa-info-circle"></i> О боте</button>
    </div>`;
    document.getElementById('dynamicMenu').innerHTML = menuHtml;
    document.getElementById('dynamicPanel').innerHTML = '';
    document.querySelectorAll('[data-action]').forEach(btn=> btn.addEventListener('click', (e)=> {
      let act = btn.dataset.action;
      if(act === 'test') chooseDifficulty();
      else if(act === 'random') startRandomTask();
      else if(act === 'infinite') startInfinite();
      else if(act === 'leaderboard') showLeaderboard();
      else if(act === 'achievements') showAchievements();
      else if(act === 'profile') showProfile();
      else if(act === 'about') showAbout();
    }));
  }

  function chooseDifficulty() { document.getElementById('dynamicPanel').innerHTML = `<div class="menu-grid"><button class="menu-btn" data-diff="easy">1–4 классы</button><button class="menu-btn" data-diff="middle">5–7 классы</button><button class="menu-btn" data-diff="hard">8+ классы</button></div><div class="inline-buttons"><button class="action-btn" id="cancelDiff">Отмена</button></div>`;
    document.querySelectorAll('[data-diff]').forEach(b=> b.addEventListener('click',e=> startTest(b.dataset.diff)));
    document.getElementById('cancelDiff').onclick = ()=> renderMenu();
  }
  function startTest(level) { let diff = level; let filtered = QUESTIONS.filter(q=> q.level === diff && q.type === 'quiz'); if(diff==='easy'){ if(filtered.length<10){ alert('недостаточно вопросов'); return; } let selected = filtered.slice(0,10); startQuizSession(selected, diff); } else { let quizSet = filtered.slice(0,5); let dynTasks = []; for(let i=0;i<5;i++) dynTasks.push(generateDynamicQuestion(diff,0)); let items = [...quizSet, ...dynTasks]; items = items.sort(()=>Math.random()-0.5); startMixedSession(items, diff); } }
  function startQuizSession(items, diff) { appState = { mode:'test', session:{ items, idx:0, correct:0, totalQuiz:items.filter(i=>i.type==='quiz').length, totalMath:items.filter(i=>i.type==='math').length, diff, score:0 }, waiting:true }; renderQuestion(); }
  function startMixedSession(items, diff) { appState = { mode:'test', session:{ items, idx:0, correct:0, diff, score:0 }, waiting:true }; renderQuestion(); }
  function renderQuestion() { let q = appState.session.items[appState.session.idx]; let optsHtml = q.options.map(opt=> `<button class="option-btn" data-opt="${opt.replace(/"/g, '&quot;')}">${opt}</button>`).join('');
    document.getElementById('dynamicMenu').innerHTML = ''; document.getElementById('dynamicPanel').innerHTML = `<div class="question-card"><div class="question-text">${q.text}</div><div class="options-grid">${optsHtml}</div><div class="inline-buttons"><button class="action-btn" id="exitTest">Выход 🚪</button></div></div>`;
    document.querySelectorAll('.option-btn').forEach(btn=> btn.addEventListener('click',()=> checkAnswer(btn.dataset.opt)));
    document.getElementById('exitTest').onclick = ()=>{ renderMenu(); appState= {mode:null}; };
  }
  function checkAnswer(selected) { let q = appState.session.items[appState.session.idx]; let isCorrect = (selected === q.answer); let store = loadStore(); if(isCorrect && q.type==='quiz') { let qidx = QUESTIONS.findIndex(qq=> qq.text === q.text && qq.level===q.level); if(qidx!==-1){ if(!store.correctAnswers) store.correctAnswers=[]; if(!store.correctAnswers.includes(qidx)) store.correctAnswers.push(qidx); saveStore(store); checkQuizExpert(); } }
    let feedback = isCorrect ? `✅ Правильно! ${q.explanation || ''}` : `❌ Неправильно! Ответ: ${q.answer}. ${q.explanation || ''}`;
    if(isCorrect) appState.session.correct = (appState.session.correct||0)+1;
    let isLast = (appState.session.idx+1 >= appState.session.items.length);
    document.getElementById('dynamicPanel').innerHTML = `<div class="feedback">${feedback}</div><div class="inline-buttons">${!isLast ? '<button class="action-btn primary" id="nextQ">Следующий вопрос ➡️</button>' : '<button class="action-btn primary" id="finishTest">Узнать результат 🏆</button>'} <button class="action-btn" id="exitMid">Выход</button></div>`;
    if(!isLast) document.getElementById('nextQ')?.addEventListener('click',()=> { appState.session.idx++; renderQuestion(); });
    else document.getElementById('finishTest')?.addEventListener('click',()=> finishTest());
    document.getElementById('exitMid')?.addEventListener('click',()=> renderMenu());
  }
  function finishTest() { let corr = appState.session.correct; let total = appState.session.items.length; let cups = corr * 0.5; updateWeeklyCups(cups); updateTestStat(corr, total, appState.session.diff); alert(`Тест завершён! Результат: ${corr}/${total}. Получено кубков: ${cups}`); renderMenu(); }
  function startRandomTask() { let diff = prompt('Уровень (middle/hard):','middle'); if(!diff) return; let q = generateDynamicQuestion(diff,0); appState = { mode:'random', session:{ q } }; document.getElementById('dynamicMenu').innerHTML=''; document.getElementById('dynamicPanel').innerHTML=`<div class="question-card"><div class="question-text">${q.text}</div><div class="options-grid">${q.options.map(o=> `<button class="option-btn" data-opt="${o}">${o}</button>`).join('')}</div><div class="inline-buttons"><button class="action-btn" id="exitRand">Выход</button></div></div>`;
    document.querySelectorAll('.option-btn').forEach(btn=> btn.addEventListener('click',()=> { let correct = (btn.dataset.opt === q.answer); alert(correct ? '✅ Верно!' : `❌ Ошибка. Ответ: ${q.answer}`); renderMenu(); }));
    document.getElementById('exitRand').onclick=()=>renderMenu();
  }
  function startInfinite() { let diff = prompt('Уровень (middle/hard):','middle'); if(!diff) return; let streak=0, score=0; function nextInf() { let q = generateDynamicQuestion(diff, streak); document.getElementById('dynamicPanel').innerHTML=`<div class="question-card"><div class="question-text">${q.text}</div><div class="options-grid">${q.options.map(o=> `<button class="option-btn" data-opt="${o}">${o}</button>`).join('')}</div><div class="stats-row">⚡ Счёт: ${score} | 🔥 Серия: ${streak}</div><div class="inline-buttons"><button class="action-btn" id="stopInf">Закончить</button></div></div>`;
      document.querySelectorAll('.option-btn').forEach(btn=> btn.addEventListener('click',()=> { let ok = (btn.dataset.opt === q.answer); if(ok){ score++; streak++; if(streak===5||streak===10) addAchievement(streak===5?'🔥 5 верных подряд':'🔥 10 верных подряд'); updateMaxStreak(streak); } else streak=0; nextInf(); }));
      document.getElementById('stopInf').onclick = () => { let cups = score*0.5; updateWeeklyCups(cups); alert(`Тренировка окончена! Правильных: ${score}, кубков: ${cups}`); renderMenu(); };
    }
    function updateMaxStreak(s) { let store=loadStore(); if(s> (store.stats.maxStreak||0)) store.stats.maxStreak=s; saveStore(store); }
    appState = { mode:'infinite' }; document.getElementById('dynamicMenu').innerHTML=''; nextInf();
  }
  function showLeaderboard() { let store = loadStore(); let wk = store.stats.weeklyCups || 0; document.getElementById('dynamicPanel').innerHTML = `<div class="question-card"><h3>🏆 Ваша статистика за неделю</h3><p style="font-size:2rem">${wk} кубков</p><div class="inline-buttons"><button class="action-btn" id="backLb">Назад</button></div></div>`;
    document.getElementById('backLb').onclick=()=>renderMenu();
  }
  function showAchievements() { let store = loadStore(); let ach = store.achievements || []; let html = `<div class="question-card"><h3>🏅 Достижения</h3>${ach.length ? ach.map(a=>`<span class="achievement-badge">${a}</span>`).join('') : '<p>Пока нет</p>'}<div class="inline-buttons"><button class="action-btn" id="backAch">Назад</button></div></div>`;
    document.getElementById('dynamicPanel').innerHTML = html; document.getElementById('backAch').onclick=()=>renderMenu();
  }
